<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hand Cricket Pro - Innings Break</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('appTheme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#3ce36a",
                    "on-tertiary-fixed": "#261a00",
                    "primary": "#3fe56c",
                    "on-primary-fixed": "#002108",
                    "on-primary": "#003912",
                    "on-error-container": "#ffdad6",
                    "on-error": "#690005",
                    "surface": "#0b1326",
                    "surface-tint": "#3ce36a",
                    "error-container": "#93000a",
                    "surface-bright": "#31394d",
                    "on-background": "#dae2fd",
                    "primary-fixed": "#69ff87",
                    "background": "#0b1326",
                    "inverse-surface": "#dae2fd",
                    "surface-variant": "#2d3449",
                    "secondary-container": "#1e95f2",
                    "on-tertiary": "#3f2e00",
                    "secondary-fixed": "#d1e4ff",
                    "secondary": "#9ecaff",
                    "primary-container": "#00c853",
                    "on-surface": "#dae2fd",
                    "on-secondary-container": "#002b4d",
                    "outline": "#869583",
                    "outline-variant": "#3c4a3c",
                    "on-secondary": "#003258",
                    "on-surface-variant": "#bbcbb8",
                    "tertiary-fixed-dim": "#fabd00",
                    "surface-container-high": "#222a3d",
                    "tertiary-container": "#dba500",
                    "tertiary": "#fdbf02",
                    "inverse-on-surface": "#283044",
                    "surface-container-highest": "#2d3449",
                    "secondary-fixed-dim": "#9ecaff",
                    "surface-container": "#171f33",
                    "surface-dim": "#0b1326",
                    "on-secondary-fixed": "#001d36",
                    "on-tertiary-fixed-variant": "#5b4300",
                    "on-secondary-fixed-variant": "#00497d",
                    "on-primary-fixed-variant": "#00531e",
                    "inverse-primary": "#006e2a",
                    "surface-container-lowest": "#060e20",
                    "on-primary-container": "#004c1b",
                    "on-tertiary-container": "#543e00",
                    "error": "#ffb4ab",
                    "surface-container-low": "#131b2e",
                    "tertiary-fixed": "#ffdf9e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "container-padding-mobile": "20px",
                    "stack-lg": "32px",
                    "stack-md": "16px",
                    "unit": "8px",
                    "gutter": "16px",
                    "container-padding-desktop": "40px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg": ["Montserrat"],
                    "headline-lg-mobile": ["Montserrat"],
                    "display-xl": ["Montserrat"],
                    "title-lg": ["Montserrat"],
                    "body-md": ["Inter"],
                    "display-lg": ["Montserrat"]
            }
          },
        },
      }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .stadium-glow {
            background: radial-gradient(circle at center, rgba(63, 229, 108, 0.15) 0%, transparent 70%);
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
            animation: float-particle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes float-particle {
            0% { transform: translateY(0) translateX(0); opacity: 0.1; }
            100% { transform: translateY(-40px) translateX(20px); opacity: 0.4; }
        }

        .score-grow {
            animation: score-pulse 2s infinite ease-in-out;
        }

        @keyframes score-pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(63, 229, 108, 0.2); }
            50% { transform: scale(1.04); text-shadow: 0 0 25px rgba(63, 229, 108, 0.8); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden relative select-none">
    <!-- Atmospheric Particles Container -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none" id="particles-container"></div>

    <!-- Top Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/10 dark:bg-surface-variant/10 backdrop-blur-md border-b border-white/15 shadow-[0_0_15px_rgba(0,200,83,0.2)]">
        <div class="max-w-5xl mx-auto px-4 md:px-8 h-16 flex justify-between items-center">
            <div class="font-headline-lg text-lg md:text-xl font-bold text-primary tracking-tight">HAND CRICKET PRO</div>
            <div class="flex gap-4">
                <span class="material-symbols-outlined text-primary-fixed-dim hover:scale-110 transition-transform duration-200 active:scale-95 cursor-pointer">settings</span>
                <span class="material-symbols-outlined text-primary-fixed-dim hover:scale-110 transition-transform duration-200 active:scale-95 cursor-pointer">account_circle</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 pt-20 pb-28 md:pt-24 md:pb-24 z-10 w-full my-auto">
        <div class="w-full max-w-md md:max-w-lg text-center space-y-6">
            <div class="space-y-1 md:space-y-2">
                <span class="font-label-lg text-xs md:text-sm text-secondary uppercase tracking-widest">Innings Break</span>
                <h1 class="font-display-lg text-3xl sm:text-4xl md:text-5xl text-on-surface font-bold">First Innings Over</h1>
            </div>

            <div class="glass-panel rounded-3xl p-5 sm:p-6 md:p-8 space-y-6 relative overflow-hidden transition-all duration-300">
                <div class="absolute inset-0 stadium-glow -z-10"></div>
                
                <!-- First Innings Stats -->
                <div class="flex justify-between items-center gap-4 px-2">
                    <div class="flex-1 text-left">
                        <p id="firstInningsTeamLabel" class="font-label-md text-xs md:text-sm text-on-surface-variant/70 uppercase font-semibold">You Scored</p>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span id="firstInningsScore" class="font-display-xl text-5xl sm:text-6xl md:text-7xl font-extrabold text-primary leading-none">0</span>
                            <span class="font-title-lg text-base md:text-lg text-primary/70 font-semibold">Runs</span>
                        </div>
                    </div>
                    <div class="h-14 md:h-16 w-px bg-white/15"></div>
                    <div class="flex-1 text-right">
                        <p class="font-label-md text-xs md:text-sm text-on-surface-variant/70 uppercase font-semibold">Wickets</p>
                        <div class="flex items-baseline justify-end gap-1 mt-1">
                            <span id="firstInningsWickets" class="font-display-xl text-5xl sm:text-6xl md:text-7xl font-extrabold text-error leading-none">0</span>
                        </div>
                    </div>
                </div>

                <!-- Visual Progress Bar -->
                <div class="w-full bg-white/5 rounded-full h-3 relative overflow-hidden">
                    <div class="bg-primary h-full rounded-full shadow-[0_0_10px_rgba(63,229,108,0.5)]" style="width: 100%">
                        <div class="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent"></div>
                    </div>
                </div>

                <!-- Target Banner -->
                <div class="py-4 border-y border-white/10">
                    <h2 class="font-display-lg text-2xl sm:text-3xl md:text-4xl text-white score-grow font-bold">
                        Target: <span id="targetScore" class="text-primary-fixed-dim">0</span>
                    </h2>
                    <p id="targetDescription" class="font-body-md text-sm md:text-base text-on-surface-variant/80 mt-2">Preparing 2nd innings...</p>
                </div>

                <!-- Format & Game Mode -->
                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <div class="bg-white/5 rounded-2xl p-3 sm:p-4 border border-white/5">
                        <p class="font-label-md text-xs text-on-surface-variant/60">Format</p>
                        <p class="font-title-lg text-sm sm:text-base md:text-lg text-on-surface font-semibold mt-0.5">Hand Cricket</p>
                    </div>
                    <div class="bg-white/5 rounded-2xl p-3 sm:p-4 border border-white/5">
                        <p class="font-label-md text-xs text-on-surface-variant/60">Mode</p>
                        <p class="font-title-lg text-sm sm:text-base md:text-lg text-on-surface font-semibold mt-0.5">VS Computer</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <button onclick="continueToSecondInnings()" class="w-full py-4 sm:py-5 rounded-2xl bg-gradient-to-br from-primary-container to-primary text-on-primary font-headline-lg text-base md:text-lg uppercase tracking-wider shadow-[0_0_20px_rgba(63,229,108,0.4)] hover:shadow-[0_0_30px_rgba(63,229,108,0.6)] md:hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer font-extrabold">
                    Start 2nd Innings
                    <span class="material-symbols-outlined text-2xl">play_arrow</span>
                </button>

                <button onclick="window.location.href='gameplay.html'" class="font-label-lg text-xs md:text-sm text-on-surface-variant/70 hover:text-primary transition-colors flex items-center justify-center gap-1.5 mx-auto cursor-pointer py-1">
                    <span class="material-symbols-outlined text-lg">bar_chart</span>
                    View Scorecard Details
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <footer class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest/80 backdrop-blur-xl border-t border-white/10 md:bottom-4 md:left-1/2 md:-translate-x-1/2 md:max-w-md md:rounded-2xl md:border md:shadow-2xl">
        <div class="w-full max-w-md mx-auto flex justify-around items-center px-4 py-2 sm:py-3">
            <div class="flex flex-col items-center justify-center bg-primary/20 text-primary-fixed-dim rounded-xl px-4 py-1.5 shadow-[0_0_10px_rgba(63,229,108,0.4)] transition-all cursor-pointer">
                <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">sports_cricket</span>
                <span class="font-label-md text-[11px] font-medium mt-0.5">Play</span>
            </div>
            <div class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors active:scale-90 cursor-pointer py-1">
                <span class="material-symbols-outlined text-xl">leaderboard</span>
                <span class="font-label-md text-[11px] font-medium mt-0.5">Stats</span>
            </div>
            <div class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors active:scale-90 cursor-pointer py-1">
                <span class="material-symbols-outlined text-xl">history</span>
                <span class="font-label-md text-[11px] font-medium mt-0.5">History</span>
            </div>
            <div class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors active:scale-90 cursor-pointer py-1">
                <span class="material-symbols-outlined text-xl">tune</span>
                <span class="font-label-md text-[11px] font-medium mt-0.5">Settings</span>
            </div>
        </div>
    </footer>

    <script>
        // Load Game State
        let gameState = JSON.parse(localStorage.getItem("gameState")) || {
            tossWinner: "player",
            playerBatting: true,
            innings: 1,
            playerScore: 0,
            cpuScore: 0,
            playerWickets: 0,
            cpuWickets: 0,
            target: 0,
            gameOver: false
        };

        function initInningsBreak() {
            const firstInningsScoreEl = document.getElementById("firstInningsScore");
            const firstInningsWicketsEl = document.getElementById("firstInningsWickets");
            const firstInningsTeamLabelEl = document.getElementById("firstInningsTeamLabel");
            const targetScoreEl = document.getElementById("targetScore");
            const targetDescEl = document.getElementById("targetDescription");

            // Determine who batted in the 1st Innings
            const playerBattedFirst = !gameState.playerBatting;

            const firstInningsScore = playerBattedFirst ? gameState.playerScore : gameState.cpuScore;
            const firstInningsWickets = playerBattedFirst ? gameState.playerWickets : gameState.cpuWickets;

            // Ensure Target and Innings State are correct
            if (!gameState.target || gameState.target === 0) {
                gameState.target = firstInningsScore + 1;
                gameState.innings = 2;
                localStorage.setItem("gameState", JSON.stringify(gameState));
            }

            // Update UI Elements
            firstInningsScoreEl.textContent = firstInningsScore;
            firstInningsWicketsEl.textContent = firstInningsWickets;
            targetScoreEl.textContent = gameState.target;

            if (playerBattedFirst) {
                firstInningsTeamLabelEl.textContent = "YOU SCORED";
                targetDescEl.textContent = `Computer needs ${gameState.target} runs to win.`;
            } else {
                firstInningsTeamLabelEl.textContent = "COMPUTER SCORED";
                targetDescEl.textContent = `You need ${gameState.target} runs to win!`;
            }
        }

        function continueToSecondInnings() {
            gameState.innings = 2;
            localStorage.setItem("gameState", JSON.stringify(gameState));
            window.location.href = "gameplay_screen.html";
        }

        // Adaptive Particle Generator
        function createParticles() {
            const container = document.getElementById('particles-container');
            container.innerHTML = '';
            const particleCount = window.innerWidth > 768 ? 35 : 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.animationDelay = `${delay}s`;

                container.appendChild(particle);
            }
        }

        // Initialize Page & Handle Window Resize
        createParticles();
        initInningsBreak();
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(createParticles, 200);
        });
    </script>
</body>
</html>
