<style>
        body {
            background-color: #0b1326;
            background-image: 
                radial-gradient(at 0% 0%, rgba(63, 229, 108, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 149, 242, 0.1) 0px, transparent 50%);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .victory-glow {
            box-shadow: 0 0 40px rgba(63, 229, 108, 0.2);
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            z-index: 10;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .animate-float {
            animation: float 4s infinite linear;
        }
    </style>

<body class="min-h-screen text-on-surface relative flex flex-col items-center">
<!-- Atmospheric Particles -->
<div class="fixed inset-0 pointer-events-none z-0" id="particle-container"></div>

<!-- Navigation Header -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-white/10 dark:bg-surface-variant/10 backdrop-blur-md border-b border-white/15 shadow-[0_0_15px_rgba(0,200,83,0.2)]">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">HAND CRICKET PRO</h1>
<div class="flex gap-4">
<button class="material-symbols-outlined text-primary-fixed-dim hover:scale-105 transition-transform duration-200 active:scale-95">settings</button>
<button class="material-symbols-outlined text-primary-fixed-dim hover:scale-105 transition-transform duration-200 active:scale-95">account_circle</button>
</div>
</header>

<main class="flex-1 w-full max-w-4xl px-container-padding-mobile pt-24 pb-32 flex flex-col items-center justify-center relative z-10">
<!-- Dynamic Trophy/Result Icon -->
<div class="mb-stack-lg relative group">
<div id="resultGlow" class="absolute -inset-8 bg-primary/20 blur-3xl rounded-full animate-pulse transition-all"></div>
<div id="resultPanel" class="glass-panel p-8 rounded-full victory-glow relative z-10 border-primary/30">
<span id="resultIcon" class="material-symbols-outlined text-[96px] text-primary" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
</div>

<!-- Dynamic Result Status -->
<div class="text-center mb-stack-lg">
<h2 id="resultTitle" class="font-display-lg text-display-lg text-primary uppercase tracking-widest mb-2">Victory!</h2>
<p id="resultSubtitle" class="font-body-lg text-body-lg text-on-surface-variant/80">You dominated the field today!</p>
</div>

<!-- Stats Bento Grid -->
<div class="grid grid-cols-2 md:grid-cols-2 gap-gutter w-full mb-stack-lg">
<!-- Score Card -->
<div class="glass-panel p-stack-md rounded-xl col-span-2 md:col-span-1 flex flex-col items-center justify-center hover:scale-[1.02] transition-transform">
<span class="font-label-lg text-label-lg text-primary-fixed-dim mb-1 uppercase">Total Runs</span>
<span id="playerScoreEl" class="font-display-xl text-display-xl text-white">0</span>
</div>
<!-- Strike Rate Card -->
<div class="glass-panel p-stack-md rounded-xl flex flex-col items-center justify-center hover:scale-[1.02] transition-transform">
<span class="font-label-lg text-label-lg text-secondary mb-1 uppercase">Strike Rate</span>
<span id="strikeRate" class="font-headline-lg text-headline-lg text-white">0.0</span>
</div>
<!-- Highest Hit Card -->

<!-- Match Comparison -->
<div class="glass-panel p-stack-md rounded-xl md:col-span-3 flex justify-between items-center hover:scale-[1.01] transition-transform">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary">analytics</span>
<span class="font-body-md text-body-md">Match Score</span>
</div>
<span id="matchSummaryText" class="font-title-lg text-title-lg text-on-surface">YOU 0 - 0 CPU</span>
</div>
</div>

<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-gutter w-full sm:justify-center">

<span class="material-symbols-outlined">refresh</span> Play Again
</button>
<button onclick="goToMainMenu()" class="glass-panel hover:bg-white/20 text-white font-label-lg text-label-lg py-4 px-8 rounded-xl hover:scale-105 active:scale-95 transition-all uppercase flex items-center justify-center gap-2">

</button>

<div class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined">tune</span>
<span class="font-label-md text-label-md">Settings</span>
        </a>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Load State from LocalStorage
        const savedState = localStorage.getItem("gameState");
        const gameState = savedState ? JSON.parse(savedState) : { 
            playerScore: 0, 
            playerBalls: 0,
            cpuScore: 0, 
            result: "WIN"
        };

        const playerScore = gameState.playerScore || 0;
        const playerBalls = gameState.playerBalls || 0;
        const cpuScore = gameState.cpuScore || 0;

        // Populate DOM elements
        const playerScoreEl = document.getElementById("playerScoreEl");
        const strikeRateEl = document.getElementById("strikeRate");
        const matchSummaryText = document.getElementById("matchSummaryText");

        if (playerScoreEl) playerScoreEl.textContent = playerScore;
        if (matchSummaryText) matchSummaryText.textContent = `YOU ${playerScore} - ${cpuScore} CPU`;

        // Calculate & Display Strike Rate from Balls Faced
        if (strikeRateEl) {
            const calculatedSR = playerBalls > 0 
                ? ((playerScore / playerBalls) * 100).toFixed(1) 
                : "0.0";
            strikeRateEl.textContent = calculatedSR;
        }

        // Adjust UI depending on Match Outcome (WIN, LOSS, TIE)
        applyMatchOutcomeUI(gameState);

        // Visual effects
        initParticles();
        if (gameState.result === "WIN" || !gameState.result) {
            spawnConfetti();
            setInterval(spawnConfetti, 5000);
        }
    });

    function applyMatchOutcomeUI(gameState) {
        const resultTitle = document.getElementById("resultTitle");
        const resultSubtitle = document.getElementById("resultSubtitle");
        const resultIcon = document.getElementById("resultIcon");
        const resultGlow = document.getElementById("resultGlow");

        if (gameState.result === "LOSS" || gameState.playerScore < gameState.cpuScore) {
            resultTitle.textContent = "Defeat";
            resultTitle.className = "font-display-lg text-display-lg text-error uppercase tracking-widest mb-2";
            resultSubtitle.textContent = "Hard luck! Better strategy next time.";
            resultIcon.textContent = "sentiment_dissatisfied";
            resultIcon.className = "material-symbols-outlined text-[96px] text-error";
            resultGlow.className = "absolute -inset-8 bg-error/20 blur-3xl rounded-full animate-pulse";
        } else if (gameState.result === "TIE") {
            resultTitle.textContent = "Match Tied";
            resultTitle.className = "font-display-lg text-display-lg text-tertiary uppercase tracking-widest mb-2";
            resultSubtitle.textContent = "An evenly fought battle!";
            resultIcon.textContent = "equalizer";
            resultIcon.className = "material-symbols-outlined text-[96px] text-tertiary";
            resultGlow.className = "absolute -inset-8 bg-tertiary/20 blur-3xl rounded-full animate-pulse";
        }
    }

    function playAgain() {
        localStorage.removeItem("gameState");
        window.location.href = "toss_screen.html";
    }

    function goToMainMenu() {
        window.location.href = "home_screen.html";
    }

    async function shareScore() {
        const savedState = localStorage.getItem("gameState");
        const gameState = savedState ? JSON.parse(savedState) : { playerScore: 0 };

        const shareText = `🏏 I just scored ${gameState.playerScore} runs in Hand Cricket Pro! Can you beat me?`;

        try {
            if (navigator.share) {
                await navigator.share({
                    title: "Hand Cricket Pro",
                    text: shareText,
                    url: window.location.href
                });
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareText);
                alert("Score copied to clipboard!");
            } else {
                prompt("Copy your score:", shareText);
            }
        } catch (err) {
            console.log("Share cancelled or failed:", err);
        }
    }

    function initParticles() {
        const particleContainer = document.getElementById('particle-container');
        if (!particleContainer) return;
        
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle animate-float';
            const size = Math.random() * 4 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100 + 100}vh`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particle.style.animationDuration = `${Math.random() * 4 + 4}s`;
            particleContainer.appendChild(particle);
        }
    }

    function spawnConfetti() {
        const colors = ['#3fe56c', '#69ff87', '#3ce36a', '#ffffff', '#9ecaff'];
        for (let i = 0; i < 60; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = '-10px';
            conf.style.borderRadius = '2px';
            conf.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            document.body.appendChild(conf);

            const duration = Math.random() * 3 + 2;
            const sideMove = (Math.random() - 0.5) * 400;

            const animation = conf.animate([
                { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                { transform: `translate(${sideMove}px, 100vh) rotate(720deg)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'cubic-bezier(.17,.67,.83,.67)'
            });

            animation.onfinish = () => conf.remove();
        }
    }
</script></body>
