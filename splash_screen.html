<style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(63, 229, 108, 0.3)); }
            50% { filter: drop-shadow(0 0 25px rgba(63, 229, 108, 0.6)); }
        }

        @keyframes particle-movement {
            from { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes progress-animation {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }

        .floating-logo {
            animation: float 4s ease-in-out infinite, pulse-glow 3s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .progress-fill {
            background: linear-gradient(90deg, #3fe56c 0%, #00c853 100%);
            box-shadow: 0 0 15px rgba(63, 229, 108, 0.5);
            animation: progress-animation 5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .progress-shine {
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
        }
    </style>

<script>
        // Particle System Generation
        const particleContainer = document.getElementById('particle-container');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 3 + 1;
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * -20;
            const opacity = Math.random() * 0.4 + 0.1;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${startX}%`;
            particle.style.top = `${startY}%`;
            particle.style.opacity = opacity;
            
            particle.style.animation = `particle-movement ${duration}s linear ${delay}s infinite`;
            
            particleContainer.appendChild(particle);
        }

        // Micro-interaction for logo interaction
        const logo = document.querySelector('.floating-logo');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            logo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Simulate Loading Completion for UI test
        setTimeout(() => {
            console.log("Loading Complete. Transitioning...");
            // Realistically, this would trigger navigation to Home
            window.location.href="home_screen.html";
        }, 5000);
    </script>
